# A pushed version tag (v1.2.1 …) builds the Windows installer on GitHub and publishes it
# to Releases with latest.yml — installed apps pick it up as an update. No personal token:
# the job uses the repository's built-in GITHUB_TOKEN.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # unit tests (pure logic) and browser tests (the main flows in the UI, with mock data)
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e

      # One draft release up front: electron-builder uploads every file into it. Without it,
      # its parallel uploads race and create two releases for the same tag.
      - name: Create draft release
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          notes="release/notes/$tag.md"
          [ -f "$notes" ] || { echo "" > /tmp/empty.md; notes=/tmp/empty.md; }
          gh release create "$tag" --draft --title "${tag#v}" --notes-file "$notes" --verify-tag

      - run: npx electron-vite build
      # Signing is on when the certificate secrets are set (see the notes in docs/SIGNING.md); without them the build is unsigned
      - run: npx electron-builder --win --publish always
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # The website (heddrate.com) is the same interface in a browser: its build rides along with
      # the release, and the server (deploy/heddify-web-sync) switches to it within a minute.
      - run: npm run build:web
      - name: Attach the website build
        shell: bash
        run: |
          tar -czf heddify-web.tar.gz -C out/web .
          gh release upload "$GITHUB_REF_NAME" heddify-web.tar.gz --clobber

      - name: Publish release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
