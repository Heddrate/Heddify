# A pushed version tag (v1.2.1 …) builds the Windows installer on GitHub and publishes it
# to Releases with latest.yml — installed apps pick it up as an update. No personal token:
# the job uses the repository's built-in GITHUB_TOKEN.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      # One draft release up front: electron-builder uploads every file into it. Without it,
      # its parallel uploads race and create two releases for the same tag.
      - name: Create draft release
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          notes="release/notes/$tag.md"
          [ -f "$notes" ] || { echo "" > /tmp/empty.md; notes=/tmp/empty.md; }
          gh release create "$tag" --draft --title "${tag#v}" --notes-file "$notes" --verify-tag

      - run: npx electron-vite build
      - run: npx electron-builder --win --publish always

      - name: Publish release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
