<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Heddify</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob: heddify-local:; media-src 'self' https: blob: scp-cache: heddify-local:; connect-src 'self' https: ws://localhost:* http://localhost:*; font-src 'self' data:; worker-src 'self' blob:"
    />
  </head>
  <body>
    <!-- the liquid glass lens: a soft displacement of what is behind the glass (see styles/glass.css) -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="1" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
